<!--
  Bug reportado: signInWithOtp (src/app/onboarding/page.tsx) manda este
  mismo tipo de mail ("magic_link") tanto para un usuario nuevo como uno
  existente. La plantilla por defecto de Supabase solo muestra
  {{ .ConfirmationURL }} — un botón de link — sin el código de 6 dígitos.
  El flujo real de la app (src/app/onboarding/verify/page.tsx) es
  verifyOtp() con un código tipeado a mano: nunca sigue este link (ver el
  comentario de src/app/auth/callback/route.ts, que solo atiende OAuth).
  Por eso acá no hay ningún link — mostrar uno que la app no consume
  confunde más de lo que ayuda.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #131315;">
  <h2 style="margin: 0 0 8px; font-size: 20px;">Tu código de PERZE</h2>
  <p style="margin: 0 0 24px; color: #5a5a60; font-size: 15px; line-height: 1.5;">
    Ingresá este código en la app para continuar. Vence en 10 minutos.
  </p>
  <p style="margin: 0 0 24px; font-size: 36px; font-weight: 700; letter-spacing: 8px; text-align: center; font-family: 'SF Mono', Consolas, monospace;">
    {{ .Token }}
  </p>
  <p style="margin: 0; color: #8a8a90; font-size: 13px; line-height: 1.5;">
    Si no pediste este código, podés ignorar este correo — nadie puede entrar a tu cuenta sin él.
  </p>
</div>
